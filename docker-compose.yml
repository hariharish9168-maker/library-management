version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart_library_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_library
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_library_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_TYPE: mysql
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: smart_library
      DATABASE_USER: library_user
      DATABASE_PASSWORD: library_password
      JWT_SECRET: super_secret_jwt_library_key_replace_in_production_2026
      FRONTEND_URL: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_library_frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mysql_data:
