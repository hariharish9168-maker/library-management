services:
  # 1. Backend REST API
  - type: web
    name: smart-library-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: auto
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend React / Vite Static Site
  - type: web
    name: smart-library-ui
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
